name: Daily update

on:
  schedule:
    - cron: "30 7 * * *"    # 3:30 AM ET — right after the last West Coast game ends
    - cron: "30 11 * * *"   # 7:30 AM ET backup — catches late finishes / skipped runs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Once the season is complete there is nothing to predict (see src/season.py).
      - name: Season gate
        id: season
        run: python3 .github/season_gate.py >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        if: steps.season.outputs.done != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-ci.txt
        if: steps.season.outputs.done != 'true'

      # Runs BEFORE the pipeline: if an Elo or feature invariant is broken there
      # is no point spending the API calls, and no point publishing predictions
      # from code that just failed its own leakage checks.
      - name: Tests
        if: steps.season.outputs.done != 'true'
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - name: Run daily pipeline
        if: steps.season.outputs.done != 'true'
        run: python daily_update.py

      - name: Commit and push updates
        if: steps.season.outputs.done != 'true'
        run: |
          git config user.name "JarvisLee511"
          git config user.email "lee.chew@northeastern.edu"
          git add data docs/data outputs/*.csv outputs/metrics.json
          if ! git diff --cached --quiet; then
            git commit -m "Daily update $(date -u +%F)"
            git pull --rebase --autostash
            git push
          fi

      # Analytics-engineering layer: rebuild the DuckDB warehouse from the freshly
      # regenerated files and run all dbt tests (incl. the feature-parity check).
      # Runs AFTER the commit so an analytics issue can never block the daily
      # prediction push; a failure here still surfaces as a red run.
      - name: Install analytics deps (dbt)
        if: steps.season.outputs.done != 'true'
        run: pip install -r requirements-analytics.txt

      - name: Build & test analytics warehouse (dbt)
        if: steps.season.outputs.done != 'true'
        working-directory: analytics/dbt
        run: |
          mkdir -p ../warehouse
          dbt build --profiles-dir .
